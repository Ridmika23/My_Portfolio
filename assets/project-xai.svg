<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#023E8A"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90E0EF"/>
      <stop offset="100%" stop-color="#0096C7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- Central icon: shield with checkmark (trust/fairness) -->
  <g transform="translate(340,60)">
    <path d="M60 0 L118 22 V70 C118 112 90 142 60 158 C30 142 2 112 2 70 V22 Z" fill="rgba(255,255,255,0.1)" stroke="#90E0EF" stroke-width="3"/>
    <path d="M32 78 L52 98 L90 52" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Neural network nodes left -->
  <g opacity="0.7" stroke="#90E0EF" stroke-width="2">
    <line x1="90" y1="130" x2="220" y2="90"/>
    <line x1="90" y1="200" x2="220" y2="90"/>
    <line x1="90" y1="200" x2="220" y2="230"/>
    <line x1="90" y1="270" x2="220" y2="230"/>
  </g>
  <g fill="#90E0EF">
    <circle cx="90" cy="130" r="9"/>
    <circle cx="90" cy="200" r="9"/>
    <circle cx="90" cy="270" r="9"/>
  </g>
  <g fill="#ffffff">
    <circle cx="220" cy="90" r="10"/>
    <circle cx="220" cy="230" r="10"/>
  </g>

  <!-- Fairness bar chart right -->
  <g>
    <rect x="560" y="240" width="44" height="140" rx="6" fill="url(#bar1)"/>
    <rect x="622" y="190" width="44" height="190" rx="6" fill="url(#bar1)" opacity="0.85"/>
    <rect x="684" y="150" width="44" height="230" rx="6" fill="url(#bar1)" opacity="0.7"/>
  </g>

  <!-- Label chip -->
  <rect x="60" y="360" width="330" height="46" rx="23" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="225" y="389" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">Explainable AI · Loan Approval</text>
</svg>
