<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023E8A"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48CAE4"/>
      <stop offset="100%" stop-color="#0096C7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad1)"/>

  <!-- Neural network nodes -->
  <g opacity="0.5" stroke="#48CAE4" stroke-width="1.5">
    <line x1="120" y1="120" x2="260" y2="80"/>
    <line x1="120" y1="120" x2="260" y2="160"/>
    <line x1="120" y1="200" x2="260" y2="80"/>
    <line x1="120" y1="200" x2="260" y2="160"/>
    <line x1="120" y1="200" x2="260" y2="230"/>
    <line x1="260" y1="80" x2="400" y2="140"/>
    <line x1="260" y1="160" x2="400" y2="140"/>
    <line x1="260" y1="230" x2="400" y2="140"/>
  </g>
  <g fill="#48CAE4">
    <circle cx="120" cy="120" r="7"/>
    <circle cx="120" cy="200" r="7"/>
    <circle cx="260" cy="80" r="7"/>
    <circle cx="260" cy="160" r="7"/>
    <circle cx="260" cy="230" r="7"/>
  </g>
  <circle cx="400" cy="140" r="10" fill="#ffffff"/>

  <!-- Bar chart representing fairness metrics -->
  <g>
    <rect x="500" y="260" width="40" height="120" rx="6" fill="url(#barGrad)"/>
    <rect x="560" y="220" width="40" height="160" rx="6" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="620" y="180" width="40" height="200" rx="6" fill="url(#barGrad)" opacity="0.7"/>
  </g>

  <!-- Shield / trust icon -->
  <g transform="translate(560,60)">
    <path d="M40 0 L80 15 V45 C80 75 60 95 40 105 C20 95 0 75 0 45 V15 Z" fill="rgba(255,255,255,0.08)" stroke="#ffffff" stroke-width="2"/>
    <path d="M22 52 L35 65 L60 35" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="50" y="400" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#ffffff" font-weight="600">Explainable AI · Fairness · Loan Approval</text>
</svg>
