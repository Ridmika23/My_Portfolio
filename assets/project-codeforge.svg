<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pill4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)"/>

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- Browser mockup -->
  <g transform="translate(90,55)">
    <rect x="0" y="0" width="620" height="340" rx="16" fill="rgba(255,255,255,0.08)" stroke="#ffffff" stroke-width="2.5"/>
    <rect x="0" y="0" width="620" height="42" rx="16" fill="rgba(255,255,255,0.14)"/>
    <circle cx="22" cy="21" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="21" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="21" r="6" fill="#27c93f"/>

    <!-- Hero text -->
    <rect x="34" y="66" width="240" height="22" rx="5" fill="rgba(255,255,255,0.5)"/>
    <rect x="34" y="96" width="190" height="14" rx="3" fill="rgba(255,255,255,0.3)"/>
    <rect x="34" y="126" width="150" height="34" rx="17" fill="url(#pill4)"/>

    <!-- 5 course icon chips -->
    <g transform="translate(34,190)">
      <rect x="0" y="0" width="106" height="90" rx="12" fill="rgba(255,255,255,0.1)"/>
      <circle cx="53" cy="34" r="18" fill="#3b82f6"/>
      <rect x="22" y="63" width="62" height="10" rx="3" fill="rgba(255,255,255,0.35)"/>

      <rect x="120" y="0" width="106" height="90" rx="12" fill="rgba(255,255,255,0.1)"/>
      <circle cx="173" cy="34" r="18" fill="#8b5cf6"/>
      <rect x="142" y="63" width="62" height="10" rx="3" fill="rgba(255,255,255,0.35)"/>

      <rect x="240" y="0" width="106" height="90" rx="12" fill="rgba(255,255,255,0.1)"/>
      <circle cx="293" cy="34" r="18" fill="#38bdf8"/>
      <rect x="262" y="63" width="62" height="10" rx="3" fill="rgba(255,255,255,0.35)"/>

      <rect x="360" y="0" width="106" height="90" rx="12" fill="rgba(255,255,255,0.1)"/>
      <circle cx="413" cy="34" r="18" fill="#f43f5e"/>
      <rect x="382" y="63" width="62" height="10" rx="3" fill="rgba(255,255,255,0.35)"/>

      <rect x="480" y="0" width="106" height="90" rx="12" fill="rgba(255,255,255,0.1)"/>
      <circle cx="533" cy="34" r="18" fill="#10b981"/>
      <rect x="502" y="63" width="62" height="10" rx="3" fill="rgba(255,255,255,0.35)"/>
    </g>
  </g>

  <!-- Code icon badge -->
  <g transform="translate(680,15)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="rgba(255,255,255,0.16)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="32" y="42" font-family="monospace" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">&lt;/&gt;</text>
  </g>

  <!-- Label chip -->
  <rect x="90" y="410" width="340" height="46" rx="23" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <text x="260" y="439" font-family="'Space Grotesk', sans-serif" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">HTML · Tailwind CSS</text>
</svg>
